<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a7d52" />
      <stop offset="1" stop-color="#06351f" />
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0.5" stop-color="#0a4429" stop-opacity="0" />
      <stop offset="1" stop-color="#031c11" stop-opacity="0.55" />
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ece8dc" />
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4ca0" />
      <stop offset="1" stop-color="#16285e" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4d27a" stop-opacity="0.85" />
      <stop offset="1" stop-color="#f4d27a" stop-opacity="0" />
    </radialGradient>
    <!-- Suit primitives, reused by <use> so every card draws identical, clean geometry. -->
    <path id="spade" d="M0,-9 C2,-4 9,-1 9,4 C9,8 4,9 1,5 C1.6,8 3,10 4.5,12 L-4.5,12 C-3,10 -1.6,8 -1,5 C-4,9 -9,8 -9,4 C-9,-1 -2,-4 0,-9 Z" />
  </defs>

  <rect width="320" height="180" fill="url(#felt)" />
  <ellipse cx="160" cy="84" rx="118" ry="66" fill="none" stroke="#3aa873" stroke-width="2" opacity="0.4" />
  <rect width="320" height="180" fill="url(#vignette)" />

  <!-- Four player chips around the table; the bottom player is the viewer, highlighted gold. Small
       partnership tabs (blue = players 0/2, orange = players 1/3) mark the two teams. -->
  <g opacity="0.92">
    <rect x="138" y="12" width="44" height="16" rx="8" fill="#0c4f31" stroke="#2f8c5e" stroke-width="1" />
    <rect x="141" y="15" width="3" height="10" rx="1.5" fill="#6cc4ec" />
    <rect x="14" y="82" width="40" height="16" rx="8" fill="#0c4f31" stroke="#2f8c5e" stroke-width="1" />
    <rect x="17" y="85" width="3" height="10" rx="1.5" fill="#ec9c78" />
    <rect x="266" y="82" width="40" height="16" rx="8" fill="#0c4f31" stroke="#2f8c5e" stroke-width="1" />
    <rect x="269" y="85" width="3" height="10" rx="1.5" fill="#ec9c78" />
  </g>
  <ellipse cx="160" cy="159" rx="44" ry="20" fill="url(#glow)" />
  <rect x="135" y="150" width="50" height="18" rx="9" fill="#e9c45f" stroke="#f4dd9a" stroke-width="1.5" />
  <rect x="144" y="153" width="3" height="12" rx="1.5" fill="#6cc4ec" />

  <!-- A short row of bid chips in the well, the opening-round affordance; the NIL chip tinted gold. -->
  <g opacity="0.95">
    <rect x="108" y="120" width="20" height="21" rx="5" fill="#12422d" stroke="#78c896" stroke-width="1" />
    <text x="118" y="135" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f0b060" text-anchor="middle">N</text>
    <rect x="132" y="120" width="20" height="21" rx="5" fill="#12422d" stroke="#78c896" stroke-width="1" />
    <text x="142" y="135" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f2f2f0" text-anchor="middle">1</text>
    <rect x="156" y="120" width="20" height="21" rx="5" fill="#1e6042" stroke="#e9c45f" stroke-width="1.5" />
    <text x="166" y="135" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f2f2f0" text-anchor="middle">2</text>
    <rect x="180" y="120" width="20" height="21" rx="5" fill="#12422d" stroke="#78c896" stroke-width="1" />
    <text x="190" y="135" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#f2f2f0" text-anchor="middle">3</text>
  </g>

  <!-- Center trick: two spades face up, one card face down. -->
  <!-- Left: ace of spades -->
  <g transform="translate(133 84) rotate(-12)">
    <rect x="-20.5" y="-29.5" width="44" height="62" rx="6" fill="#00000028" />
    <rect x="-22" y="-31" width="44" height="62" rx="6" fill="url(#card)" stroke="#cdc7b6" stroke-width="1" />
    <text x="-18" y="-16" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#1a1a20">A</text>
    <use href="#spade" transform="translate(-13 -9) scale(0.42)" fill="#1a1a20" />
    <use href="#spade" transform="translate(1 6) scale(1.5)" fill="#1a1a20" />
  </g>
  <!-- Right: face-down card back -->
  <g transform="translate(187 84) rotate(12)">
    <rect x="-20.5" y="-29.5" width="44" height="62" rx="6" fill="#00000028" />
    <rect x="-22" y="-31" width="44" height="62" rx="6" fill="url(#back)" stroke="#d8c188" stroke-width="1.5" />
    <rect x="-16" y="-25" width="32" height="50" rx="4" fill="none" stroke="#9fb0e4" stroke-width="1" opacity="0.7" />
    <path d="M-16 -8 L16 -25 M-16 8 L16 -25 M-16 25 L16 -8 M-16 25 L16 8" stroke="#9fb0e4" stroke-width="0.8" opacity="0.35" />
  </g>
  <!-- Center, on top: the king of spades -->
  <g transform="translate(160 76)">
    <rect x="-20.5" y="-29.5" width="44" height="62" rx="6" fill="#00000030" />
    <rect x="-22" y="-31" width="44" height="62" rx="6" fill="url(#card)" stroke="#cdc7b6" stroke-width="1" />
    <text x="-18" y="-16" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#1a1a20">K</text>
    <use href="#spade" transform="translate(-13 -9) scale(0.42)" fill="#1a1a20" />
    <use href="#spade" transform="translate(1 6) scale(1.5)" fill="#1a1a20" />
  </g>
</svg>
